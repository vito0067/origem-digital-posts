<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Posts · Origem Digital</title><style>
:root{--fundo:#F8FAFC;--cartao:#fff;--tinta:#1E1B4B;--cinza:#64748B;--linha:#E2E8F0;--azul:#4F46E5}
